name: Fork CI Build

on:
  push:
    branches:
      - ci/fork-build
  workflow_dispatch:

jobs:
  build_apks:
    runs-on: ubuntu-latest
    env:
      GIT_ACTOR: ${{ secrets.GIT_ACTOR }}
      GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build APKs
        run: ./gradlew assembleCanary assembleRelease --console=plain

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: HyperCeiler-apks
          path: |
            app/build/outputs/apk/canary/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
